services:
  scraper:
    build: .
    container_name: linkedin-scraper
    ports:
      - "8501:8501"          # L'app est accessible sur http://localhost:8501
    volumes:
      - .:/app               # Persiste les données (base, cookie, profils scrapés) sur la machine
    environment:
      - PYTHONUNBUFFERED=1
      - SCRAPER_HEADLESS=false   # Chrome visible (sous Xvfb) — requis LinkedIn
      - SCRAPER_STEALTH=false    # pas de camouflage → app LinkedIn complète
      - TZ=Europe/Paris
    shm_size: "1gb"              # /dev/shm pour la stabilité de Chrome
    restart: unless-stopped
